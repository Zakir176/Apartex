<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Accent Gradient -->
    <linearGradient id="apartexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8621A" />
      <stop offset="50%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    
    <!-- Navy Depth Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B" />
      <stop offset="100%" stop-color="#0F2347" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E8621A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#navyGrad)" />

  <!-- Outer Architectural Pillar Arch (Stylized Letter A) -->
  <path d="M 256 96 L 396 376 L 336 376 L 256 206 L 176 376 L 116 376 Z" 
        fill="url(#apartexGrad)" 
        filter="url(#logoGlow)" />

  <!-- Inner Building Structure Cutout (High-rise Penthouse Silhouette) -->
  <path d="M 256 160 L 320 310 L 290 310 L 256 230 L 222 310 L 192 310 Z" 
        fill="#FFFFFF" 
        opacity="0.95" />

  <!-- Glass Balcony / Horizon Bridge Accent -->
  <rect x="180" y="316" width="152" height="18" rx="9" fill="url(#apartexGrad)" />

  <!-- Window Dots Accent -->
  <circle cx="256" cy="190" r="8" fill="#E8621A" />
  <circle cx="236" cy="270" r="7" fill="#1B3A6B" opacity="0.8" />
  <circle cx="276" cy="270" r="7" fill="#1B3A6B" opacity="0.8" />
</svg>
