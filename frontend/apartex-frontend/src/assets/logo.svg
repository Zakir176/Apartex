<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Main building body -->
  <rect x="96" y="160" width="320" height="300" rx="24" fill="url(#emeraldGrad)" filter="url(#shadow)" />

  <!-- Roof / top triangle -->
  <polygon points="256,60 80,180 432,180" fill="#1B3A6B" rx="8" />

  <!-- Windows row 1 -->
  <rect x="150" y="220" width="60" height="55" rx="8" fill="white" opacity="0.9" />
  <rect x="226" y="220" width="60" height="55" rx="8" fill="white" opacity="0.9" />
  <rect x="302" y="220" width="60" height="55" rx="8" fill="white" opacity="0.9" />

  <!-- Windows row 2 -->
  <rect x="150" y="300" width="60" height="55" rx="8" fill="white" opacity="0.7" />
  <rect x="302" y="300" width="60" height="55" rx="8" fill="white" opacity="0.7" />

  <!-- Door -->
  <rect x="210" y="340" width="92" height="120" rx="12" fill="#1B3A6B" opacity="0.9" />
  <circle cx="294" cy="403" r="6" fill="#059669" />

  <!-- Accent dot on roof peak -->
  <circle cx="256" cy="190" r="8" fill="#059669" />
</svg>
